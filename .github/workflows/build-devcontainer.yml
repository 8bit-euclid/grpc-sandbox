name: Build DevContainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to registry
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/devcontainer:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

      - name: Report cache status
        run: |
          if [[ "${{ steps.build.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ Docker build cache hit - layers were reused from cache"
          else
            echo "🔨 Docker build cache miss - building from scratch or partial cache"
          fi

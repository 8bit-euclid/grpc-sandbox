name: Test DevContainer

on:
  workflow_run:
    workflows: ["Build DevContainer"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install DevContainers CLI
        run: npm install -g @devcontainers/cli

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull pre-built devcontainer image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          docker pull "$IMAGE"

      - name: Configure devcontainer to use pre-built image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          jq --arg image "$IMAGE" \
            '.image = $image | del(.build)' \
            .devcontainer/devcontainer.json > temp.json
          mv temp.json .devcontainer/devcontainer.json

      - name: Run devcontainer tests
        run: devcontainer up --workspace-folder .

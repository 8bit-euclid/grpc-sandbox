name: Test DevContainer

on:
  workflow_run:
    workflows: ["Build DevContainer"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check devcontainer cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .devcontainer-test-success
          key: devcontainer-test-${{ hashFiles('.devcontainer/**/*.json', '.devcontainer/**/*.sh', '.devcontainer/**/Dockerfile') }}

      - name: Report cache status
        run: |
          if [[ "${{ steps.cache.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ Test cache hit - skipping all tests"
          else
            echo "🧪 Test cache miss - running all tests"
          fi

      - name: Run test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Login and pull image from registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          docker pull "$IMAGE"

          # Install CLI, modify devcontainer.json to use pre-built image, and test
          npm install -g @devcontainers/cli
          jq --arg image "$IMAGE" \
            '.image = $image | del(.build)' \
            .devcontainer/devcontainer.json > temp.json
          mv temp.json .devcontainer/devcontainer.json
          devcontainer up --workspace-folder .

          # Cache success
          echo "Test passed at $(date)" > .devcontainer-test-success

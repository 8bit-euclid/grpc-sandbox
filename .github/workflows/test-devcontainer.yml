name: Test DevContainer

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push DevContainer image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

      - name: Install Dev Containers CLI and jq
        run: |
          npm install -g @devcontainers/cli
          sudo apt-get update && sudo apt-get install -y jq

      - name: Test DevContainer
        run: |
          # Use the first tag from the metadata output
          IMAGE_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          echo "Using image: $IMAGE_TAG"

          # Pull the image locally so devcontainer CLI can find it
          docker pull "$IMAGE_TAG"

          # Create a temporary devcontainer.json that uses the built image
          jq --arg image "$IMAGE_TAG" '.image = $image | del(.build)' .devcontainer/devcontainer.json > .devcontainer/devcontainer.temp.json
          mv .devcontainer/devcontainer.temp.json .devcontainer/devcontainer.json

          # Test the devcontainer
          devcontainer up --workspace-folder .

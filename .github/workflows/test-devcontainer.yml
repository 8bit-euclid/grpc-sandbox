name: Test DevContainer

on:
  workflow_run:
    workflows: ["Build DevContainer"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache DevContainers CLI
        if: steps.cache.outputs.cache-hit != 'true'
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: devcontainers-cli-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            devcontainers-cli-${{ runner.os }}-

      - name: Install DevContainers CLI
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install -g @devcontainers/cli

      - name: Run test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Login and pull image from registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          docker pull "$IMAGE"

          # Modify devcontainer.json to use pre-built image
          jq --arg image "$IMAGE" \
            '.image = $image | del(.build)' \
            .devcontainer/devcontainer.json > temp.json
          mv temp.json .devcontainer/devcontainer.json
          
          # Run devcontainer to trigger post-create script and tests
          devcontainer up --workspace-folder .

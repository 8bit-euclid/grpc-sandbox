name: Build and Test DevContainer

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      - name: Cache DevContainer layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-devcontainer-${{ hashFiles('.devcontainer/**') }}
          restore-keys: |
            ${{ runner.os }}-devcontainer-

      - name: Build DevContainer
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          # Configure Docker to use buildx with cache
          docker buildx create --use --name devcontainer-builder --driver docker-container || true
          docker buildx use devcontainer-builder

          # Build with DevContainer CLI's native cache options
          devcontainer build --workspace-folder . \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --cache-to "type=local,dest=/tmp/.buildx-cache-new,mode=max"

      - name: Replace cache
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d "/tmp/.buildx-cache-new" ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: Test DevContainer
        run: devcontainer up --workspace-folder .

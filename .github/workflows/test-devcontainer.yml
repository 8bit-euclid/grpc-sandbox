name: Test DevContainer

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DevContainer image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/devcontainer:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

      - name: Test DevContainer
        run: |
          npm install -g @devcontainers/cli

          IMAGE_TAG="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          docker pull "$IMAGE_TAG"

          # Update devcontainer.json to use the built image
          jq --arg image "$IMAGE_TAG" '.image = $image | del(.build)' .devcontainer/devcontainer.json > temp.json
          mv temp.json .devcontainer/devcontainer.json

          devcontainer up --workspace-folder .

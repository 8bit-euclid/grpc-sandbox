name: Test DevContainer

on:
  workflow_run:
    workflows: ["Build DevContainer"]
    types: [completed]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          HASH=$(find .devcontainer -type f \( -name "*.json" -o -name "*.sh" -o -name "Dockerfile" \) -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          echo "key=devcontainer-test-$HASH" >> $GITHUB_OUTPUT

      - name: Check test cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .devcontainer-test-success
          key: ${{ steps.cache-key.outputs.key }}

      - name: Report cache status
        run: |
          if [[ "${{ steps.cache.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ Test cache hit - skipping all tests"
          else
            echo "🧪 Test cache miss - running all tests"
          fi

      - name: Run test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Login and pull image
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}"
          docker pull "$IMAGE"

          # Install CLI and test
          npm install -g @devcontainers/cli
          jq --arg image "$IMAGE" '.image = $image | del(.build)' .devcontainer/devcontainer.json > temp.json
          mv temp.json .devcontainer/devcontainer.json
          devcontainer up --workspace-folder .

          # Cache success
          echo "Test passed at $(date)" > .devcontainer-test-success

version: v2
managed:
  enabled: true

# SINGLE SOURCE OF TRUTH FOR VERSIONS
# When updating versions, update BOTH files to match:
# - buf.gen.yaml (below)
# - MODULE.bazel (protobuf: "31.0", grpc: "1.73.1")

plugins:
  # Go generation
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: &go-out gen/go
  - remote: buf.build/grpc/go:v1.5.1
    out: *go-out

  # C++ generation - Must match MODULE.bazel versions
  - remote: buf.build/protocolbuffers/cpp:v31.0  # Must match MODULE.bazel protobuf: "31.0"
    out: &cpp-out gen/c++
  - remote: buf.build/grpc/cpp:v1.73.1           # Must match MODULE.bazel grpc: "1.73.1"
    out: *cpp-out

  # Python generation
  - remote: buf.build/protocolbuffers/python:v31.0
    out: &python-out gen/python
  - remote: buf.build/protocolbuffers/pyi:v31.1
    out: *python-out
  - remote: buf.build/grpc/python:v1.73.1
    out: *python-out